<!DOCTYPE html>
<!-- このファイルがHTML5で書かれていることを宣言 -->

<html lang="ja">
<!-- ページの言語を日本語にする -->

<head>
    <!-- ページの設定を書く場所 -->

    <meta charset="UTF-8">
    <!-- 日本語などの文字を正しく表示するための設定 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- スマホの画面幅に合わせて表示するための設定 -->

    <title>EITAN GO</title>
    <!-- ブラウザのタブに表示される名前 -->

    <link rel="stylesheet" href="style.css">
    <!-- style.cssを読み込む -->

    <link rel="manifest" href="manifest.json">
    <!-- manifest.jsonを読み込む -- >

</head>


<body>
    <! -- ここから実際に画面に表示する内容 -->


    <!-- ==================== -->
    <!-- ホーム画面 -->
    <!-- ==================== -->

   <div id="homePage">

    <!-- ==================== -->
    <!-- アプリのタイトル -->
    <!-- ==================== -->

    <h1>よぉこそ！</h1>

    <h2>EITAN GO</h2>

    <p>MY英単語帳</p>


    <!-- ==================== -->
    <!-- ページ移動ボタン -->
    <!-- ==================== -->

    <button id="wordPageButton">
        単語帳ずも
    </button>

    <button id="quizPageButton">
        クイズも
    </button>


    <!-- ==================== -->
    <!-- テーマ設定 -->
    <!-- ==================== -->

    <div id="themeSettings">

        <h3>画面の明るさ</h3>

        <!-- ライトモードを選ぶ -->
        <button id="lightModeButton">
            ライト（まぶしい）
        </button>

        <!-- ダークモードを選ぶ -->
        <button id="darkModeButton">
            ダーク（くらい）
        </button>

    </div>

</div>



    <!-- ==================== -->
    <!-- 単語帳画面 -->
    <!-- ==================== -->

    <div id="wordPage" style="display: none;">

        <!-- ホーム画面に戻るボタン -->
        <button id="wordBackButton">
            ← ホームかも
        </button>

        <h1> 単語帳かも</h1>


        <!-- ==================== -->
        <!-- 単語登録エリア -->
        <!-- ==================== -->

        <div class="word-form">

            <h2>単語または熟語、言い回しを登録</h2>


            <!-- 英単語の入力 -->
            <label for="word">英単語</label>

            <input
                type="text"
                id="word"
                placeholder="例：zumo、ずも、ズモ"
            >


            <!-- 意味の入力 -->
            <label for="meaning">意味</label>

            <input
                type="text"
                id="meaning"
                placeholder="例：zumo、ずも、ズモ"
            >


            <!-- スペルの入力 -->
            <label for="spelling">スペル</label>

            <input
                type="text"
                id="spelling"
                placeholder="例：zumo、ずも、ズモ"
            >


            <!-- 単語を登録するボタン -->
            <button id="addWordButton">
                単語を登録
            </button>

        </div>


        <!-- ==================== -->
        <!-- 登録済み単語一覧 -->
        <!-- ==================== -->

        <div id="wordList">

            <!-- JavaScriptによってここに単語が追加される -->

        </div>

    </div>



    <!-- ==================== -->
    <!-- クイズ画面 -->
    <!-- ==================== -->

    <div id="quizPage" style="display: none;">

        <!-- ホーム画面に戻るボタン -->
        <button id="quizBackButton">
            ← ホームかも
        </button>

        <h1> クイズかも</h1>


        <!-- ==================== -->
        <!-- クイズの設定 -->
        <!-- ==================== -->

        <div id="quizSettings">

            <h2>クイズの問題数</h2>


            <!-- 問題数を選ぶ -->
            <select id="quizCount">

                <option value="10">10問</option>

                <option value="20">20問</option>

                <option value="30">30問</option>

                <option value="50">50問</option>

                <option value="100">100問</option>

            </select>


            <!-- クイズ開始ボタン -->
            <button id="startQuizButton">
                クイズ開始
            </button>

        </div>



        <!-- ==================== -->
        <!-- クイズ本体 -->
        <!-- ==================== -->

        <div id="quizGame" style="display: none;">

            <!-- 現在何問目か -->
            <p id="quizProgress">
                第 1 / 10 問
            </p>


            <!-- 現在の正解数 -->
            <p id="quizScore">
                正解数：0
            </p>


            <!-- 問題文 -->
            <h2 id="quizQuestion">
                ここに問題が表示されます
            </h2>


            <!-- 選択肢 -->
            <div id="quizOptions">

                <!-- JavaScriptによってここに選択肢が追加される -->

            </div>


            <!-- 次の問題へ進むボタン -->
            <button id="nextQuizButton">
                次の問題
            </button>


            <!-- クイズ終了後に表示するボタン -->
            <button id="retryQuizButton" style="display: none;">
                もう一度挑戦する
            </button>

        </div>

    </div>



    <!-- ==================== -->
    <!-- JavaScript -->
    <!-- ==================== -->

    <script src="script.js"></script>
    <!-- script.jsを読み込む -->

</body>

</html>
