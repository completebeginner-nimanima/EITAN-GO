<!DOCTYPE html>
<!-- このファイルがHTML5で書かれていることを宣言 -->

<html lang="ja">
<!-- ページの言語を日本語にする -->

<head>

    <meta charset="UTF-8">
    <!-- 日本語などの文字を正しく表示するための設定 -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- スマホの画面幅に合わせて表示するための設定 -->

    <title>EITAN GO</title>
    <!-- ブラウザのタブに表示される名前 -->

    <link rel="stylesheet" href="style.css">
    <!-- style.cssを読み込む -->

    <link rel="manifest" href="manifest.json">
    <!-- PWAの設定を読み込む -->

</head>


<body>


    <!-- ==================== -->
    <!-- ホーム画面 -->
    <!-- ==================== -->

    <div id="homePage">

        <h1>よぉこそ！</h1>

        <h2>EITAN GO</h2>

        <p>MY単語帳</p>


        <!-- ページ移動ボタン -->

        <button id="wordPageButton">
            単語帳ずも
        </button>

        <button id="quizPageButton">
            クイズも
        </button>


        <!-- テーマ設定 -->

        <div id="themeSettings">

            <h3>画面の明るさ</h3>

            <button id="lightModeButton">
                ライト（まぶしい）
            </button>

            <button id="darkModeButton">
                ダーク（くらい）
            </button>

        </div>

    </div>



    <!-- ==================== -->
    <!-- 単語帳画面 -->
    <!-- ==================== -->

    <div id="wordPage" style="display: none;">

        <!-- ホーム画面に戻るボタン -->

        <button id="wordBackButton">
            ← ホームかも
        </button>

        <h1>単語帳かも</h1>


        <!-- ==================== -->
        <!-- 単語登録エリア -->
        <!-- ==================== -->

        <div class="word-form">

            <h2>単語または熟語、言い回しを登録</h2>


            <!-- 単語 -->

            <label for="word">
                単語
            </label>

            <input
                type="text"
                id="word"
                placeholder="例：zumo、ずも、ズモ"
            >


            <!-- 意味 -->

            <label for="meaning">
                意味
            </label>

            <input
                type="text"
                id="meaning"
                placeholder="例：zumo、ずも、ズモ"
            >


            <!-- スペル -->

            <label for="spelling">
                スペル
            </label>

            <input
                type="text"
                id="spelling"
                placeholder="例：zumo、ずも、ズモ"
            >


            <!-- 単語登録ボタン -->

            <button id="addWordButton">
                単語を登録
            </button>

        </div>



        <!-- ==================== -->
        <!-- バックアップ機能 -->
        <!-- ==================== -->

        <div id="backupSettings">

            <h2>単語帳のバックアップ</h2>


            <!-- 単語をファイルとして保存するボタン -->

            <button id="backupButton">
                バックアップ
            </button>


            <!-- 保存した単語を復元するボタン -->

            <button id="restoreButton">
                復元ずもも
            </button>


            <!-- 復元するJSONファイルを選ぶ場所 -->

            <input
                type="file"
                id="restoreFile"
                accept=".json"
                style="display: none;"
            >

        </div>



        <!-- ==================== -->
        <!-- 登録済み単語一覧 -->
        <!-- ==================== -->

        <div id="wordList">

            <!-- JavaScriptによってここに単語が追加される -->

        </div>

    </div>



    <!-- ==================== -->
    <!-- クイズ画面 -->
    <!-- ==================== -->

    <div id="quizPage" style="display: none;">

        <!-- ホーム画面に戻るボタン -->

        <button id="quizBackButton">
            ← ホームかも
        </button>

        <h1>クイズかも</h1>


        <!-- ==================== -->
        <!-- クイズの設定 -->
        <!-- ==================== -->

        <div id="quizSettings">

            <h2>クイズの問題数</h2>


            <select id="quizCount">

                <option value="10">
                    10問
                </option>

                <option value="20">
                    20問
                </option>

                <option value="30">
                    30問
                </option>

                <option value="50">
                    50問
                </option>

                <option value="100">
                    100問
                </option>

            </select>


            <button id="startQuizButton">
                クイズ開始
            </button>

        </div>



        <!-- ==================== -->
        <!-- クイズ本体 -->
        <!-- ==================== -->

        <div id="quizGame" style="display: none;">

            <p id="quizProgress">
                第 1 / 10 問
            </p>


            <p id="quizScore">
                正解数：0
            </p>


            <h2 id="quizQuestion">
                ここに問題が表示されます
            </h2>


            <div id="quizOptions">

                <!-- JavaScriptによってここに選択肢が追加される -->

            </div>


            <button id="nextQuizButton">
                次の問題
            </button>


            <button id="retryQuizButton" style="display: none;">
                もう一度挑戦する
            </button>

        </div>

    </div>



    <!-- ==================== -->
    <!-- JavaScript -->
    <!-- ==================== -->

    <script src="script.js"></script>
    <!-- script.jsを読み込む -->


</body>

</html>
